name: Update region data

on:
  schedule:
    - cron: '0 * * * *'   # hourly, top of hour (UTC)
  workflow_dispatch:
    inputs:
      probe_limit:
        description: "Max new candidates to probe"
        default: "200"

permissions:
  contents: write

concurrency:
  group: cfip-regions-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline
        id: pipeline
        run: |
          set -o pipefail
          python3 pipeline/update_data.py \
            --data-dir data \
            --probe-limit "${{ github.event.inputs.probe_limit || '200' }}" \
            --per-net 6 \
            --timeout 6 \
            --workers 32 2>&1 | tee pipeline_run.log
        # Pipeline exit codes:
        #   0 = at least one region matched;  1 = zero matches (warning logged, data preserved);
        #   2 = source outage (data preserved, run fails loudly).

      - name: Summarize results
        if: always()
        run: |
          echo "## Region data update $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'EOF'
          import json, pathlib
          p = pathlib.Path("data/audit.json")
          if not p.exists():
              print("NO AUDIT — pipeline did not complete"); raise SystemExit(1)
          d = json.loads(p.read_text())
          st = d["stats"]
          print(f"probed={st['probed']} reachable_colo={st['reachable_colo']} region_matched={st['region_matched']}")
          for r in ["hk","jp","sg","us","de","nl"]:
              print(f"{r.upper()}: {len(d['rows'][r])} verified")
          empty = [r for r in ["hk","jp","sg","us","de","nl"] if not d["rows"][r]]
          if empty:
              print(f"EMPTY (not fabricated): {', '.join(empty)}")
          EOF

      - name: Commit data (only when changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "update region data $(date -u +%FT%H%MZ) [skip ci]"
            git push
          fi
